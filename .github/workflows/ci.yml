name: ros2-ci

on:
  push:
  pull_request:

# 直接在官方 ros:jazzy 容器里跑，步骤和虚拟机上一样。
# 之前用 ros-tooling/action-ros-ci：它要重新克隆私有仓库（需要 token），
# 而且 v0.4 在 ubuntu-24.04 runner 上会把 HOME 污染成多行字符串，导致
# ament_cmake 的 Python 步骤找不到 ament_package，随机炸在某个包上。
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖（rosdep）
        shell: bash
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy

      - name: 编译
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          MAKEFLAGS=-j2 colcon build --symlink-install --parallel-workers 2 \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: 单元测试
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --parallel-workers 2
          colcon test-result --all --verbose
