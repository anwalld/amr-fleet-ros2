schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: 室内 AMR 调度软件（ROS2 Jazzy + C++17，colcon 工作区，src/ 下 19 个包）。
  二开路线：M0 基线 → M1 拆出 TrafficService → M2 滚动路权 + 多车 → M3 等待图死锁检测与解除 → M4 Qt 6 调度台 → M5 收尾。
  调度核心在 robot_tasks：决策逻辑写成不依赖 ROS 的 Plan* 纯函数并配 GoogleTest，节点只做接线。
  编译与测试在 Ubuntu 24.04 虚拟机上跑（ubuntu@<VM IP>:~/robot_ws），Mac 只写代码、管 git。
  对外接口（服务名、类型、行为）默认保持兼容；改动接口必须在提案里写明。
  验证：白天只跑单元测试（colcon test）；全量验收、压测等整栈测试每天最多跑一次，统一放在夜间批处理里。
  基线与对比记录在 docs/baseline/；简历用的数据必须来自实际运行，不得编造。

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
