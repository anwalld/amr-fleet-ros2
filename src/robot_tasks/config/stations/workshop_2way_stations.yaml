# 车间路网 · 双向版（M3 死锁压测与场景用）：站点、坐标、停车位与 workshop 完全相同，
# 改动只有两处，用来制造对向和短环：
#
#   1. 4 段边改为双向：横穿 jn_s – machining – jn_n，外环 jn_sw – receiving、jn_n – packing。
#      南北两侧的车都会借道横穿，在 machining 两侧对向相遇（两车对向：一车在 jn_s 等
#      machining，另一车在 machining 等 jn_s）。
#   2. 新增一条单向斜边 jn_se → machining（8.49 m），与 jn_s → jn_se、machining → jn_s 组成
#      3 站有向环：三台车分别停在 jn_s、jn_se、machining，各等下一站即成环（三车成环）。
#      另有 5 站环 jn_s → jn_se → assembly → jn_n → machining → jn_s。
#
# 其余边仍为单向；6 个停车位 park_1..6 是单向支路，也是默认的避让点（未写 yield_point，
# 按 park_ 前缀判定）。站点间距最小 4.24 m（≥ 3 m）。
