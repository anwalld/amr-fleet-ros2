# 车间路网（M2 多机压测用）：16 个站点，全部单向边。
#
# 外环 9 站（逆时针）：jn_sw → receiving → jn_s → jn_se → assembly → jn_n → packing → jn_nw → storage → jn_sw
# 横穿：jn_s → machining → jn_n，与外环下半段 + 左半段组成第二条环（8 站）。
# 6 个避让 / 停车位 park_1..6 是与外环某条边平行的单向支路（比直走长，最短路不会借道），
# 每台车空闲时回自己的停车位，不堵外环。
# 最短有向环 8 站 > 车数 6：滚动申请下“每车占一个站等下一个站”的循环等待不可能形成。
# 站点间距最小 4.24 m（≥ 3 m）。工作站：receiving、machining、assembly、packing、storage。
